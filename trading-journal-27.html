<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>레저 — 매매 기록</title>
<style>
  :root{
    --bg: #000000;
    --surface: #0A0A0B;
    --surface-2: #151516;
    --line: #232325;
    --ink: #F5F5F5;
    --ink-dim: #86868B;
    --gain: #32D74B;
    --gain-dim: #1F7A2E;
    --loss: #FF453A;
    --loss-dim: #8C2A24;
    color-scheme: dark;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; -webkit-text-size-adjust:100%;}
  body{
    background:#050506;
    color:var(--ink);
    font-family: 'IBM Plex Sans', 'Apple SD Gothic Neo', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  #app, #loading{
    background:var(--bg);
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    padding-bottom:calc(76px + env(safe-area-inset-bottom));
    padding-top:env(safe-area-inset-top);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    position:relative;
  }
  #app.app-flush{ padding-bottom:0; min-height:auto; }
  .tab-bar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px;
    display:flex;
    background:rgba(10,10,11,0.92);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    z-index:50;
  }
  .tab-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--ink-dim);
    padding:6px 2px; cursor:pointer; font-family:inherit;
  }
  .tab-btn svg{ width:22px; height:22px; }
  .tab-btn span{ font-size:10px; }
  .tab-btn.active{ color:var(--ink); }

  .num{ font-family:'IBM Plex Mono',ui-monospace,'SF Mono','SFMono-Regular',Menlo,Consolas,monospace; font-variant-numeric: tabular-nums; letter-spacing:-0.03em; }
  button, input, select, textarea{ touch-action:manipulation; }
  button{ -webkit-appearance:none; appearance:none; }

  header{
    padding:28px 20px 20px;
    border-bottom:1px solid var(--line);
    background:var(--bg);
  }
  .ledger-title{
    font-size:13px;
    letter-spacing:0.04em;
    color:var(--ink-dim);
    margin:0 0 4px;
  }
  .balance{
    font-size:38px;
    font-weight:600;
    margin:0;
    line-height:1.1;
  }
  .balance-usd{
    font-size:15px;
    font-weight:400;
    color:var(--ink-dim);
    margin:2px 0 0;
  }
  .balance-sub{
    margin-top:6px;
    display:flex;
    gap:14px;
    font-size:14px;
    color:var(--ink-dim);
  }
  .balance-sub b.pos{ color:var(--gain); }
  .balance-sub b.neg{ color:var(--loss); }
  .start-edit-btn{
    background:none; border:none; color:var(--ink-dim); font-size:12px;
    text-decoration:underline; padding:0; margin-left:4px; cursor:pointer;
  }
  .start-edit-box{ display:none; margin-top:14px; }
  .start-edit-box.open{ display:block; }
  .settings-row{ display:flex; justify-content:space-between; align-items:center; font-size:14px; color:var(--ink-dim); }

  .section{ padding:20px; border-bottom:1px solid var(--line); }
  .history-section{
    background:var(--surface);
    border-top:8px solid var(--bg);
    border-bottom:8px solid var(--bg);
  }
  .section h2{
    font-size:14px;
    font-weight:600;
    color:var(--ink-dim);
    margin:0 0 14px;
  }

  #chartWrap{ width:100%; overflow:hidden; }
  .chart-card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 14px 12px; }
  .chart-area{ display:flex; align-items:stretch; }
  .chart-ylabels{
    display:flex; flex-direction:column; justify-content:space-between;
    width:46px; flex-shrink:0; padding-right:6px; text-align:right;
    font-size:11px; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace;
  }
  .chart-svg-wrap{ flex:1; min-width:0; }
  .chart-xlabels{
    display:flex; justify-content:space-between; margin-left:52px; margin-top:6px;
    font-size:11px; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace;
  }
  #chartWrap svg{ width:100%; height:auto; display:block; }

  .setup-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
    padding:18px;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:13px;
    color:var(--ink-dim);
    margin-bottom:6px;
  }
  .field input, .field textarea, .field select{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 12px;
    color:var(--ink);
    font-size:16px;
    font-family:inherit;
  }
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none;
    border-color:#3A3A3D;
  }
  textarea{ resize:vertical; min-height:60px; }

  .btn{
    display:inline-block;
    width:100%;
    text-align:center;
    padding:12px;
    border-radius:6px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:#000;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .btn:active{ opacity:0.75; }
  .btn.ghost{
    border-color:var(--line);
    background:transparent;
    color:var(--ink-dim);
    font-weight:400;
  }

  .row2{ display:flex; gap:10px; }
  .row2 > .field{ flex:1; }

  .entry-toggle{
    display:flex; justify-content:space-between; align-items:center;
    cursor:pointer;
  }
  .entry-toggle .plus{ font-size:22px; color:var(--ink); }

  #entryForm{ margin-top:16px; display:none; }
  #entryForm.open{ display:block; }

  .segmented{ display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .segmented button{
    flex:1; padding:9px; background:var(--surface-2); color:var(--ink-dim);
    border:none; font-size:14px; cursor:pointer; font-family:inherit;
  }
  .segmented button.active.gain{ background:rgba(50,215,75,0.15); color:var(--gain); }
  .segmented button.active.loss{ background:rgba(255,69,58,0.15); color:var(--loss); }

  .month-group{ margin-bottom:6px; }
  .month-label{
    font-size:13px; color:var(--ink-dim); margin-bottom:4px; margin-top:10px;
  }

  .entry-row-compact{
    display:flex; align-items:center; gap:8px;
    padding:9px 0; border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .entry-row-compact:last-child{ border-bottom:none; }
  .er-date{ color:var(--ink-dim); width:34px; flex-shrink:0; font-size:12px; }
  .er-amt{ font-weight:600; white-space:nowrap; flex-shrink:0; }
  .er-amt.pos{ color:var(--gain); }
  .er-amt.neg{ color:var(--loss); }
  .er-tags{
    flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    color:var(--ink-dim); font-size:12px;
  }
  .er-actions{ flex-shrink:0; display:flex; gap:8px; }

  .detail-toggle{
    display:flex; justify-content:space-between; align-items:center;
    cursor:pointer; padding:12px 10px; margin-top:12px; margin-bottom:4px;
    border:1px solid var(--line); border-radius:8px; background:var(--surface-2);
    font-size:13px; color:var(--ink); font-weight:500;
  }
  .detail-toggle .plus{ font-size:18px; color:var(--ink-dim); }
  #detailBox{ display:none; }
  #detailBox.open{ padding:2px 2px 4px; margin-bottom:4px; }
  #detailBox.open{ display:block; }
  .entry-edit, .entry-del, .insight-del{ font-size:12px; color:var(--ink-dim); background:none; border:none; padding:6px 2px; margin:-6px -2px; cursor:pointer; }
  .entry-edit:active, .entry-del:active, .insight-del:active{ color:var(--ink); }

  .empty{ text-align:center; color:var(--ink-dim); font-size:14px; padding:30px 0; }

  .kpi-grid{ display:flex; gap:5px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; }
  .kpi-card{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:9px 10px; flex:1 0 92px; min-width:92px;
  }
  .kpi-card-wide{ flex:1 0 128px; min-width:128px; }
  .kpi-label{ font-size:11px; color:var(--ink-dim); margin-bottom:4px; white-space:nowrap; }
  .kpi-value{ font-size:16px; font-weight:600; white-space:nowrap; }
  .kpi-value.pos{ color:var(--gain); }
  .kpi-value.neg{ color:var(--loss); }
  .kpi-sub{ font-size:11px; color:var(--ink-dim); margin-top:2px; white-space:nowrap; }
  .kpi-bar{ display:flex; width:100%; height:8px; border-radius:4px; overflow:hidden; margin-top:8px; background:var(--surface-2); }
  .kpi-bar-green{ background:var(--gain); height:100%; }
  .kpi-bar-red{ background:var(--loss); height:100%; }
  .kpi-streak{ display:flex; gap:3px; margin-top:2px; }
  .streak-chip{
    width:20px; height:20px; border-radius:5px; display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:700;
  }
  .streak-w{ background:rgba(50,215,75,0.18); color:var(--gain); }
  .streak-l{ background:rgba(255,69,58,0.18); color:var(--loss); }

  .eval-row{
    display:flex; justify-content:space-between; padding:9px 0;
    border-bottom:1px solid var(--line); font-size:13px; color:var(--ink-dim);
  }
  .eval-row:last-child{ border-bottom:none; }
  .eval-row .num{ color:var(--ink); font-weight:600; }

  .pbar-row{ display:flex; align-items:center; gap:10px; padding:6px 0; font-size:12px; }
  .pbar-label{ width:52px; flex-shrink:0; color:var(--ink-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pbar-track{ flex:1; height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden; }
  .pbar-fill{ height:100%; border-radius:4px; }
  .pbar-fill.bar-pos{ background:var(--gain); }
  .pbar-fill.bar-neg{ background:var(--loss); }
  .pbar-val{ width:64px; flex-shrink:0; text-align:right; font-weight:600; }

  .detail-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .memo-box{
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:12px 14px; margin-bottom:14px;
  }
  .memo-label{ font-size:11px; color:var(--ink-dim); margin-bottom:4px; }
  .memo-text{ font-size:14px; line-height:1.5; overflow-wrap:anywhere; white-space:pre-wrap; }
  .detail-entry{
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:12px 14px; margin-bottom:8px;
  }
  .detail-entry-top{ display:flex; justify-content:space-between; font-size:14px; font-weight:600; margin-bottom:4px; }
  .detail-entry-tags{ font-size:12px; color:var(--ink-dim); margin-bottom:4px; }

  .db-scroll{ overflow-x:auto; margin:0 -20px; padding:0 20px; -webkit-overflow-scrolling:touch; }
  .db-table{ border-collapse:collapse; font-size:12px; white-space:nowrap; }
  .db-table th, .db-table td{ padding:9px 10px; border-bottom:1px solid var(--line); text-align:left; }
  .db-table th{ color:var(--ink-dim); font-weight:500; font-size:11px; }
  .db-table td.pos{ color:var(--gain); }
  .db-table td.neg{ color:var(--loss); }
  .db-table .db-text{ max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-dim); }
  .db-table .entry-edit, .db-table .entry-del{ font-size:11px; }
  .db-chip{ display:inline-block; font-size:11px; padding:2px 7px; border-radius:4px; background:var(--surface-2); color:var(--ink-dim); white-space:nowrap; }
  .db-chip-gain{ background:rgba(50,215,75,0.14); color:var(--gain); }
  .db-chip-loss{ background:rgba(255,69,58,0.14); color:var(--loss); }
  .entry-tag-up{ background:rgba(50,215,75,0.14); color:var(--gain); }
  .entry-tag-down{ background:rgba(255,69,58,0.14); color:var(--loss); }
  .entry-tag-flat{ background:rgba(10,132,255,0.16); color:#5AC8FA; }
  .entry-tag-unclear{ background:rgba(255,159,10,0.16); color:#FF9F0A; }

  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .cal-nav{ background:none; border:none; color:var(--ink-dim); font-size:20px; padding:8px 14px; cursor:pointer; }
  .cal-nav:active{ color:var(--ink); }
  .cal-title-wrap{ display:flex; align-items:center; gap:8px; }
  .cal-title{ font-size:15px; font-weight:600; }
  .cal-today-btn{
    font-size:11px; color:var(--ink-dim); background:var(--surface-2);
    border:1px solid var(--line); border-radius:20px; padding:3px 9px; cursor:pointer;
  }
  .cal-today-btn:active{ color:var(--ink); }
  .cal-card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:var(--ink-dim); margin-bottom:8px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-cell{
    min-height:58px; border-radius:8px; background:var(--surface-2);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:12px; color:var(--ink-dim); position:relative; cursor:pointer;
    padding:4px 2px; overflow:hidden;
  }
  .cal-cell.empty-cell{ background:transparent; }
  .cal-day{ font-size:11px; }
  .cal-amt{ font-size:10px; margin-top:3px; font-weight:700; line-height:1.2; white-space:nowrap; }
  .cal-count{ font-size:8px; color:var(--ink-dim); margin-top:1px; white-space:nowrap; }
  .cal-empty-label{ font-size:8px; color:var(--ink-dim); opacity:0.5; margin-top:3px; }
  .cal-cell.cal-pos{ background:rgba(50,215,75,0.14); }
  .cal-cell.cal-pos .cal-amt{ color:var(--gain); }
  .cal-cell.cal-neg{ background:rgba(255,69,58,0.14); }
  .cal-cell.cal-neg .cal-amt{ color:var(--loss); }
  .cal-cell.cal-today{ box-shadow: inset 0 0 0 1.5px var(--ink); }

  .month-list{ display:flex; flex-direction:column; gap:8px; }
  .month-card{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:13px 16px; font-size:14px; color:var(--ink-dim); cursor:pointer;
  }
  .month-card.month-pos{ color:var(--gain); border-color:rgba(50,215,75,0.25); background:rgba(50,215,75,0.06); }
  .month-card.month-neg{ color:var(--loss); border-color:rgba(255,69,58,0.25); background:rgba(255,69,58,0.06); }
  .month-card span:first-child{ color:var(--ink); font-weight:500; }
  .month-usd{ color:var(--ink-dim); font-weight:400; font-size:12px; }

  .setup-screen{ padding:60px 20px; }
  .setup-confirm{
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:32px; background:#000;
  }
  .setup-confirm-check{
    width:56px; height:56px; border-radius:50%; background:rgba(50,215,75,0.14);
    color:var(--gain); font-size:28px; display:flex; align-items:center; justify-content:center;
    margin-bottom:20px;
  }
  .setup-confirm-label{ font-size:14px; color:var(--ink-dim); margin:0 0 10px; }
  .setup-confirm-amount{ font-size:34px; font-weight:600; margin:0 0 10px; }
  .setup-confirm-sub{ font-size:13px; color:var(--ink-dim); margin:0 0 32px; max-width:280px; line-height:1.5; }
  .setup-confirm .btn{ max-width:220px; }
  .setup-screen h1{ font-size:20px; margin-bottom:6px; }
  .setup-screen p{ color:var(--ink-dim); font-size:14px; margin-bottom:24px; line-height:1.6; }

  #loading{ padding:40px; text-align:center; color:var(--ink-dim); }

  .mantra{
    position:relative;
    background:#000;
    background-size:cover;
    background-position:center top;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding:0 28px 64px;
    text-align:center;
    border-bottom:1px solid var(--line);
    overflow:hidden;
  }
  .mantra-overlay{
    position:absolute; inset:0;
    background:linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.05) 28%, rgba(0,0,0,0.1) 55%, rgba(0,0,0,0.92) 100%);
  }
  .mantra-content{ position:relative; z-index:1; max-width:360px; }
  .mantra-word{
    font-family:Georgia,'Times New Roman',serif;
    font-weight:700;
    font-size:46px;
    letter-spacing:0.03em;
    color:#fff;
    margin:0 0 16px;
    text-transform:uppercase;
    line-height:1;
  }
  .mantra-text{
    position:relative;
    z-index:1;
    font-size:15px;
    line-height:1.75;
    color:rgba(255,255,255,0.82);
    font-weight:500;
    margin:0;
    max-width:340px;
    letter-spacing:-0.01em;
  }

  .insight-row{
    display:flex; align-items:flex-start; gap:10px;
    padding:11px 0; border-bottom:1px solid var(--line);
  }
  .insight-row:last-child{ border-bottom:none; }
  .insight-date{ font-size:12px; color:var(--ink-dim); width:74px; flex-shrink:0; padding-top:1px; }
  .insight-text{ flex:1; font-size:14px; line-height:1.5; overflow-wrap:anywhere; }
  .insight-actions{ flex-shrink:0; display:flex; gap:8px; }
  .insight-edit{ font-size:12px; color:var(--ink-dim); background:none; border:none; padding:6px 2px; margin:-6px -2px; cursor:pointer; }
  .insight-edit:active{ color:var(--ink); }
  .insight-edit-box{ padding:11px 0; border-bottom:1px solid var(--line); }
</style>
</head>
<body>

<div id="loading">불러오는 중…</div>
<div id="app" style="display:none;"></div>

<script>
(function(){

var accountData = null; // {startCapital, startDate}
var entries = []; // [{id, date(YYYY-MM-DD), pnl, marketState, reason, invalidation}]
var insights = []; // [{id, date, text}]

// 저장소 계층: window.storage를 우선 시도하고, 실패하면 localStorage로 자동 전환
var useLocalFallback = false;

async function storageGet(key){
  if(!useLocalFallback){
    try{
      var r = await window.storage.get(key);
      return r ? r.value : null;
    }catch(e){
      console.warn('window.storage 사용 불가, localStorage로 전환:', e);
      useLocalFallback = true;
    }
  }
  try{
    return window.localStorage.getItem('tj_' + key);
  }catch(e){
    console.error('localStorage도 사용 불가:', e);
    return null;
  }
}

async function storageSet(key, value){
  if(!useLocalFallback){
    try{
      var r = await window.storage.set(key, value);
      if(!r) throw new Error('empty response');
      return;
    }catch(e){
      console.warn('window.storage 저장 실패, localStorage로 전환:', e);
      useLocalFallback = true;
    }
  }
  try{
    window.localStorage.setItem('tj_' + key, value);
  }catch(e){
    console.error('localStorage 저장도 실패:', e);
    alert('저장에 실패했습니다: ' + e.message);
  }
}

async function loadAll(){
  try{
    var accStr = await storageGet('account');
    accountData = accStr ? JSON.parse(accStr) : null;
  }catch(e){ accountData = null; }
  try{
    var entStr = await storageGet('entries');
    entries = entStr ? JSON.parse(entStr) : [];
  }catch(e){ entries = []; }
  try{
    var insStr = await storageGet('insights');
    insights = insStr ? JSON.parse(insStr) : [];
  }catch(e){ insights = []; }
  try{
    var memoStr = await storageGet('dailyMemos');
    dailyMemos = memoStr ? JSON.parse(memoStr) : {};
  }catch(e){ dailyMemos = {}; }
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='block';
  render();
  fetchHeaderRate();
}

async function saveAccount(){
  await storageSet('account', JSON.stringify(accountData));
}
async function saveEntries(){
  await storageSet('entries', JSON.stringify(entries));
}
async function saveInsights(){
  await storageSet('insights', JSON.stringify(insights));
}

function fmt(n){
  var sign = n < 0 ? '-' : '';
  return sign + Math.abs(n).toLocaleString('ko-KR');
}
function compactFmt(n){
  var sign = n < 0 ? '-' : '';
  var abs = Math.abs(n);
  function trim(v){
    var r = v.toFixed(1);
    return r.endsWith('.0') ? r.slice(0,-2) : r;
  }
  if(abs >= 100000000) return sign + trim(abs/100000000) + '억';
  if(abs >= 10000) return sign + trim(abs/10000) + '만';
  return sign + Math.round(abs).toLocaleString('ko-KR');
}
function parseMoney(str){
  if(str === null || str === undefined) return NaN;
  return parseFloat(String(str).replace(/,/g, ''));
}
function attachMoneyFormat(el){
  if(!el) return;
  el.addEventListener('input', function(){
    var raw = el.value.replace(/[^0-9.]/g, '');
    var dotIdx = raw.indexOf('.');
    var intPart = dotIdx === -1 ? raw : raw.slice(0, dotIdx);
    var decPart = dotIdx === -1 ? '' : raw.slice(dotIdx+1, dotIdx+3);
    intPart = intPart.replace(/^0+(?=\d)/, '');
    var formatted = intPart ? parseInt(intPart, 10).toLocaleString('en-US') : '';
    el.value = formatted + (dotIdx !== -1 ? '.' + decPart : '');
  });
}
function todayStr(){
  var d = new Date();
  return d.toISOString().slice(0,10);
}
function currentBalance(){
  var bal = accountData.startCapital;
  entries.forEach(function(e){ bal += e.pnl; });
  return bal;
}

// ---------- USD 환산 (헤더) ----------
var headerRate = null;
async function fetchHeaderRate(){
  try{
    var resp = await Promise.race([
      fetch('https://open.er-api.com/v6/latest/USD'),
      new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('timeout')); }, 6000); })
    ]);
    var data = await resp.json();
    if(data && data.rates && data.rates.KRW){ headerRate = data.rates.KRW; }
  }catch(e){ headerRate = null; }
  updateHeaderDollar();
}
function updateHeaderDollar(){
  var el = document.getElementById('headerUsd');
  if(!el || !accountData) return;
  if(!headerRate){ el.textContent = ''; return; }
  el.textContent = '$' + Math.round(currentBalance() / headerRate).toLocaleString('en-US');
}

// 특정 날짜의 환율 조회: 오늘이면 헤더 환율 재사용, 과거 날짜면 그날 환율 API 조회
var rateCache = {}; // { 'YYYY-MM-DD': rate }
async function fetchRateForDate(dateStr){
  if(dateStr === todayStr()){
    if(!headerRate) await fetchHeaderRate();
    return headerRate || null;
  }
  if(rateCache[dateStr]) return rateCache[dateStr];
  try{
    var resp = await Promise.race([
      fetch('https://api.frankfurter.app/' + dateStr + '?from=USD&to=KRW'),
      new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('timeout')); }, 6000); })
    ]);
    var data = await resp.json();
    if(data && data.rates && data.rates.KRW){
      rateCache[dateStr] = data.rates.KRW;
      return data.rates.KRW;
    }
  }catch(e){}
  return null;
}

function renderMantraSection(){
  var img = introVariant === 'warrior' ? WARRIOR_IMG : STATUE_IMG;

  return '' +

    '<div class="mantra-overlay"></div>' +
    '<div class="mantra-content">' +
      wordHtml +
      '<p class="mantra-text">"설명할 수 있는 직관은 의지해도 좋다.<br>직관과 희망을 혼돈하지 않기 위해 기록한다."</p>' +

var editingInsightId = null;

function renderInsightsSection(){
  var sorted = insights.slice().sort(function(a,b){ return b.id - a.id; });
  var list = sorted.length === 0
    ? '<p class="empty">아직 기록한 깨달음이 없습니다</p>'
    : sorted.map(function(i){
        if(editingInsightId === i.id){
          return '' +
          '<div class="insight-edit-box">' +
            '<div class="field"><textarea id="insightEditInput">'+escapeHtml(i.text)+'</textarea></div>' +
            '<button class="btn" id="saveInsightEditBtn" data-iid="'+i.id+'">저장</button>' +
            '<button class="btn ghost" id="cancelInsightEditBtn" style="margin-top:8px;">취소</button>' +
          '</div>';
        }
        return '' +
        '<div class="insight-row">' +
          '<div class="insight-date num">'+i.date+'</div>' +
          '<div class="insight-text">'+escapeHtml(i.text)+'</div>' +
          '<div class="insight-actions"><button class="insight-edit" data-iid="'+i.id+'">수정</button><button class="insight-del" data-iid="'+i.id+'">삭제</button></div>' +
        '</div>';
      }).join('');

  return '' +
  '<div class="section">' +
    '<h2>심리 · 마인드컨트롤 기록</h2>' +
    '<div class="field"><textarea id="insightInput" placeholder="매매 전 다잡은 마음, 깨달은 점을 적어두세요"></textarea></div>' +
    '<button class="btn ghost" id="addInsightBtn" style="margin-bottom:16px;">깨달음 추가</button>' +
    list +
  '</div>';
}

function bindInsights(){
  var btn = document.getElementById('addInsightBtn');
  if(btn){
    btn.onclick = async function(){
      var el = document.getElementById('insightInput');
      var text = el.value.trim();
      if(!text) return;
      insights.push({ id: Date.now(), date: todayStr(), text: text });
      await saveInsights();
      render();
    };
  }
  document.querySelectorAll('.insight-edit').forEach(function(b){
    b.onclick = function(){
      editingInsightId = parseInt(b.getAttribute('data-iid'));
      render();
    };
  });
  document.querySelectorAll('.insight-del').forEach(function(b){
    b.onclick = async function(){
      var id = parseInt(b.getAttribute('data-iid'));
      if(!confirm('이 깨달음을 삭제할까요?')) return;
      insights = insights.filter(function(i){ return i.id !== id; });
      if(editingInsightId === id) editingInsightId = null;
      await saveInsights();
      render();
    };
  });
  var saveEditBtn = document.getElementById('saveInsightEditBtn');
  if(saveEditBtn){
    saveEditBtn.onclick = async function(){
      var id = parseInt(saveEditBtn.getAttribute('data-iid'));
      var text = document.getElementById('insightEditInput').value.trim();
      if(!text) return;
      var idx = insights.findIndex(function(i){ return i.id === id; });
      if(idx !== -1) insights[idx].text = text;
      editingInsightId = null;
      await saveInsights();
      render();
    };
  }
  var cancelEditBtn = document.getElementById('cancelInsightEditBtn');
  if(cancelEditBtn){
    cancelEditBtn.onclick = function(){
      editingInsightId = null;
      render();
    };
  }
}

// ---------- Render ----------
var activeTab = 'intro';

var setupConfirm = false;

function render(){
  var app = document.getElementById('app');
  if(!accountData){
    app.innerHTML = renderMantraSection() + renderSetup();
    bindSetup();
    return;
  }
  if(setupConfirm){
    app.innerHTML = renderSetupConfirm();
    bindSetupConfirm();
    return;
  }
  var bal = currentBalance();
  var totalPnl = bal - accountData.startCapital;
  var pct = accountData.startCapital ? (totalPnl / accountData.startCapital * 100) : 0;

  var content = '';
  if(activeTab === 'intro'){
    content = renderMantraSection();
  } else if(activeTab === 'home'){
    content =
      renderHeader(bal, totalPnl, pct) +
      renderStatsCardsSection(totalPnl) +
      renderChartSection() +
      renderEvaluationSection();
  } else if(activeTab === 'mind'){
    content = renderMantraSection();
  } else if(activeTab === 'calendar'){
    content = renderCalendarSection() + renderDetailView() + renderMonthlySection();
  } else if(activeTab === 'add'){
    content = renderAddSection();
  } else if(activeTab === 'settings'){
    content = renderSettingsSection();
  }

  app.innerHTML = '<div id="tabContent">' + content + '</div>' + renderTabBar();
  app.classList.toggle('app-flush', activeTab === 'intro' || activeTab === 'mind');

  bindTabBar();
  if(activeTab === 'home'){ bindHeader(); drawChart(); }
  if(activeTab === 'calendar'){ bindMonthly(); bindCalendar(); bindDetailView(); bindHistory(); }
  if(activeTab === 'add'){ bindAdd(); }
  if(activeTab === 'settings'){ bindSettings(); }
}

var tabLabels = { home:'홈', mind:'마인드', calendar:'캘린더', add:'기록', settings:'설정' };

function renderTabBar(){
  var order = ['mind','calendar','home','add','settings'];
  var items = order.map(function(t){
    return '<button type="button" class="tab-btn'+(activeTab===t?' active':'')+'" data-tab="'+t+'">'+tabIcons[t]+'<span>'+tabLabels[t]+'</span></button>';
  }).join('');
  return '<div class="tab-bar">'+items+'</div>';
}

function bindTabBar(){
  document.querySelectorAll('.tab-btn').forEach(function(b){
    b.onclick = function(){
      activeTab = b.getAttribute('data-tab');
      window.scrollTo(0,0);
      render();
    };
  });
}

function renderSetup(){
  return '' +
  '<div class="setup-screen">' +
    '<h1>시작 자본을 입력하세요</h1>' +
    '<p>여기서부터 매매 기록이 시작됩니다. 이후 일/월별 손익을 더하면 자산 곡선이 자동으로 그려집니다.</p>' +
    '<div class="setup-card">' +
      '<div class="field"><label>시작 날짜</label><input type="date" id="setupDate" value="'+todayStr()+'"></div>' +
      '<div class="field"><label>시작 자본 (원)</label><input type="text" id="setupAmount" placeholder="예: 3,000,000" inputmode="decimal"></div>' +
      '<button class="btn" id="setupBtn">기록 시작</button>' +
    '</div>' +
  '</div>';
}

function bindSetup(){
  attachMoneyFormat(document.getElementById('setupAmount'));
  document.getElementById('setupBtn').onclick = async function(){
    var amt = parseMoney(document.getElementById('setupAmount').value);
    if(isNaN(amt) || amt <= 0){ alert('시작 자본을 올바르게 입력해 주세요.'); return; }
    var startDate = document.getElementById('setupDate').value || todayStr();
    accountData = { startCapital: amt, startDate: startDate, currency: 'KRW' };
    await saveAccount();
    setupConfirm = true;
    render();
  };
}

function renderSetupConfirm(){
  return '' +
  '<div class="setup-confirm">' +
    '<div class="setup-confirm-check">✓</div>' +
    '<p class="setup-confirm-label">기록이 시작됐어요</p>' +

    '<button class="btn" id="setupConfirmBtn">시작하기 →</button>' +
  '</div>';
}
function bindSetupConfirm(){
  document.getElementById('setupConfirmBtn').onclick = function(){
    setupConfirm = false;
    render();
  };
}

  var cls = totalPnl >= 0 ? 'pos' : 'neg';

  '<header>' +
    '<p class="ledger-title">현재 잔고</p>' +
    '<p class="balance num">'+fmt(Math.round(bal))+'원</p>' +

    '<div class="balance-sub">' +
      '<b class="'+cls+' num">'+(totalPnl>=0?'+':'')+fmt(Math.round(totalPnl))+'원 ('+(pct>=0?'+':'')+Math.round(pct).toLocaleString('ko-KR')+'%)</b>' +
    '</div>' +
  '</header>';
}

var calendarDate = new Date();
var summaryYear = new Date().getFullYear();
var monthNames = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

var detailView = { type: 'day', key: todayStr() }; // {type:'day', key:'YYYY-MM-DD'} or {type:'month', key:'YYYY-MM'} — 기본값: 오늘

function renderMonthlySection(){
  var totals = new Array(12).fill(0);
  var usdTotals = new Array(12).fill(0);
  var hasUsd = new Array(12).fill(false);
  var hasData = new Array(12).fill(false);
  entries.forEach(function(e){
    if(parseInt(e.date.slice(0,4),10) === summaryYear){
      var mi = parseInt(e.date.slice(5,7),10) - 1;
      totals[mi] += e.pnl;
      hasData[mi] = true;
      var rate = e.fxRate || headerRate;
      if(rate){ usdTotals[mi] += e.pnl / rate; hasUsd[mi] = true; }
    }
  });

  var cards = totals.map(function(t, i){
    var cls = 'month-card';
    var amt = '0원';
    var mkey = summaryYear + '-' + String(i+1).padStart(2,'0');
    if(hasData[i]){
      cls += t >= 0 ? ' month-pos' : ' month-neg';
      amt = (t>=0?'+':'') + fmt(Math.round(t)) + '원';
      if(hasUsd[i]){
        amt += ' <span class="month-usd">('+(usdTotals[i]>=0?'+':'-')+'$'+Math.round(Math.abs(usdTotals[i])).toLocaleString('en-US')+')</span>';
      }
    }
    return '<div class="'+cls+'" data-month="'+mkey+'"><span>'+monthNames[i]+'</span><span class="num">'+amt+'</span></div>';
  }).join('');

  return '' +
  '<div class="section">' +
    '<div class="cal-header">' +
      '<button type="button" class="cal-nav" id="sumPrev">‹</button>' +
      '<h2 style="margin:0;">'+summaryYear+'년 월별 현황</h2>' +
      '<button type="button" class="cal-nav" id="sumNext">›</button>' +
    '</div>' +
    '<div class="month-list">'+cards+'</div>' +
  '</div>';
}

function renderCalendarSection(){
  var year = calendarDate.getFullYear();
  var month = calendarDate.getMonth();
  var firstDay = new Date(year, month, 1);
  var startWeekday = firstDay.getDay();
  var daysInMonth = new Date(year, month+1, 0).getDate();

  var dayTotals = {};
  var dayCounts = {};
  entries.forEach(function(e){
    if(e.date.slice(0,4) == year && parseInt(e.date.slice(5,7),10) === month+1){
      dayTotals[e.date] = (dayTotals[e.date] || 0) + e.pnl;
      dayCounts[e.date] = (dayCounts[e.date] || 0) + 1;
    }
  });

  var cells = '';
  for(var i=0;i<startWeekday;i++){ cells += '<div class="cal-cell empty-cell"></div>'; }
  for(var day=1; day<=daysInMonth; day++){
    var dateStr = year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    var total = dayTotals[dateStr];
    var cls = 'cal-cell';
    var bodyHtml;
    if(total !== undefined){
      cls += total >= 0 ? ' cal-pos' : ' cal-neg';
      bodyHtml = '<div class="cal-amt num">'+(total>=0?'+':'')+compactFmt(total)+'</div><div class="cal-count">'+dayCounts[dateStr]+'건</div>';
    } else {
      bodyHtml = '<div class="cal-empty-label">거래없음</div>';
    }
    if(dateStr === todayStr()) cls += ' cal-today';
    cells += '<div class="'+cls+'" data-date="'+dateStr+'"><div class="cal-day">'+day+'</div>'+bodyHtml+'</div>';
  }

  var weekdayRow = ['일','월','화','수','목','금','토'].map(function(w){ return '<span>'+w+'</span>'; }).join('');
  var isCurrentMonth = (year === new Date().getFullYear() && month === new Date().getMonth());

  return '' +
  '<div class="section">' +
    '<h2>캘린더</h2>' +
    '<div class="cal-card">' +
      '<div class="cal-header">' +
        '<button type="button" class="cal-nav" id="calPrev">‹</button>' +
        '<div class="cal-title-wrap"><span class="cal-title">'+year+'년 '+(month+1)+'월</span>'+(isCurrentMonth?'':'<button type="button" id="calToday" class="cal-today-btn">오늘</button>')+'</div>' +

      '<div class="cal-weekdays">'+weekdayRow+'</div>' +
      '<div class="cal-grid">'+cells+'</div>' +
    '</div>' +
  '</div>';

function computeReturnRate(e){
  if(!accountData || !accountData.startCapital) return null;
  var base = accountData.startCapital;
  if(e.positionSize !== undefined && e.positionSize !== '' && e.positionSize > 0){
    base = accountData.startCapital * (e.positionSize/100);
  }
  if(!base) return null;
  return (e.pnl / base * 100);
}

function computeStats(){
  var wins = entries.filter(function(e){ return e.pnl > 0; });
  var losses = entries.filter(function(e){ return e.pnl < 0; });
  var totalTrades = entries.length;
  var winRate = totalTrades ? Math.round(wins.length/totalTrades*100) : 0;
  var avgWin = wins.length ? Math.round(wins.reduce(function(a,b){return a+b.pnl;},0)/wins.length) : 0;
  var avgLoss = losses.length ? Math.round(losses.reduce(function(a,b){return a+b.pnl;},0)/losses.length) : 0;
  var grossWin = wins.reduce(function(a,b){return a+b.pnl;},0);
  var grossLoss = Math.abs(losses.reduce(function(a,b){return a+b.pnl;},0));
  var profitFactor = grossLoss > 0 ? (grossWin/grossLoss) : (grossWin > 0 ? Infinity : 0);
  var biggestWin = wins.length ? Math.max.apply(null, wins.map(function(e){return e.pnl;})) : 0;
  var biggestLoss = losses.length ? Math.min.apply(null, losses.map(function(e){return e.pnl;})) : 0;

  var dayMap = {};
  entries.forEach(function(e){ dayMap[e.date] = (dayMap[e.date]||0) + e.pnl; });
  var days = Object.keys(dayMap);
  var winDays = days.filter(function(d){ return dayMap[d] > 0; });
  var lossDays = days.filter(function(d){ return dayMap[d] < 0; });
  var totalDayPnl = days.reduce(function(a,d){ return a+dayMap[d]; }, 0);
  var avgPerTradingDay = days.length ? Math.round(totalDayPnl/days.length) : 0;

  var sortedDays = days.slice().sort();
  var streakChips = sortedDays.slice(-6).map(function(d){ return dayMap[d] >= 0 ? 'W' : 'L'; });

  var cum = accountData.startCapital;
  var sparkPoints = [cum];
  sortedDays.forEach(function(d){ cum += dayMap[d]; sparkPoints.push(cum); });

  return {
    totalTrades: totalTrades, winRate: winRate, winCount: wins.length, lossCount: losses.length,
    avgWin: avgWin, avgLoss: avgLoss, profitFactor: profitFactor,
    grossWin: grossWin, grossLoss: grossLoss,
    biggestWin: biggestWin, biggestLoss: biggestLoss,
    tradingDays: days.length, winDays: winDays.length, lossDays: lossDays.length,
    avgPerTradingDay: avgPerTradingDay, streakChips: streakChips, sparkPoints: sparkPoints
  };
}

function buildSparkPath(points, W, H){
  if(points.length < 2) return '';
  var min = Math.min.apply(null, points), max = Math.max.apply(null, points);
  if(min === max){ min -= 1; max += 1; }
  var stepX = W/(points.length-1);
  var color = points[points.length-1] >= points[0] ? '#32D74B' : '#FF453A';
  var d = points.map(function(v,i){
    var x = i*stepX;
    var y = H - ((v-min)/(max-min))*H;
    return (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  return '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2"/>';
}

      '</div>' +

        '<div class="kpi-value num" style="font-size:14px;color:var(--gain);">+'+compactFmt(s.grossWin)+'</div>' +

function pbarChart(labels, values){
  var maxAbs = 1;
  values.forEach(function(v){ maxAbs = Math.max(maxAbs, Math.abs(v)); });
  return labels.map(function(l,i){
    var v = values[i];
    var pct = Math.max(2, Math.round(Math.abs(v)/maxAbs*100));
    var cls = v >= 0 ? 'bar-pos' : 'bar-neg';
    return '' +
    '<div class="pbar-row">' +
      '<span class="pbar-label">'+escapeHtml(l)+'</span>' +
      '<div class="pbar-track"><div class="pbar-fill '+cls+'" style="width:'+pct+'%;"></div></div>' +
      '<span class="pbar-val num">'+(v>=0?'+':'')+compactFmt(v)+'</span>' +
    '</div>';
  }).join('');
}

function renderPerformanceChartsSection(){
  var byMarket = {};
  entries.forEach(function(e){
    var k = e.marketState || '미지정';
    byMarket[k] = (byMarket[k]||0) + e.pnl;
  });
  var marketKeys = Object.keys(byMarket).sort(function(a,b){ return byMarket[b]-byMarket[a]; });

  var byWeekday = [0,0,0,0,0,0,0];

  entries.forEach(function(e){
    var d = new Date(e.date+'T00:00:00');
    byWeekday[d.getDay()] += e.pnl;

  '</div>' +
  '<div class="section">' +
    '<h2>요일별 성과</h2>' +
    (hasWeekdayData ? pbarChart(wdLabels, byWeekday) : '<p class="empty">기록을 추가하면 여기 표시돼요</p>') +

function renderChartSection(){
  if(entries.length === 0){
    return '<div class="section"><h2>자산 곡선</h2><p class="empty">기록을 추가하면 곡선이 나타납니다</p></div>';
  }
  return '' +
  '<div class="section"><h2>자산 곡선</h2>' +
    '<div class="chart-card">' +
      '<div class="chart-area">' +
        '<div id="chartYLabels" class="chart-ylabels"></div>' +
        '<div id="chartWrap" class="chart-svg-wrap"></div>' +
      '</div>' +
      '<div id="chartXLabels" class="chart-xlabels"></div>' +
    '</div>' +
  '</div>';
}

function drawChart(){
  var wrap = document.getElementById('chartWrap');
  if(!wrap) return;
  var sorted = entries.slice().sort(function(a,b){ return a.date.localeCompare(b.date) || a.id - b.id; });
  var dates = [accountData.startDate].concat(sorted.map(function(e){ return e.date; }));
  var points = [accountData.startCapital];
  sorted.forEach(function(e){ points.push(points[points.length-1] + e.pnl); });

  var W = 600, H = 140;

  var min = Math.min.apply(null, points), max = Math.max.apply(null, points);
  if(min === max){ min -= 1; max += 1; }
  var range = max - min;
  var stepX = W / (points.length - 1 || 1);

  function xAt(i){ return i*stepX; }
  function yAt(v){ return H - ((v-min)/range)*H; }

  var coords = points.map(function(v,i){ return [xAt(i), yAt(v)]; });
  var pathD = coords.map(function(c,i){ return (i===0?'M':'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1); }).join(' ');
  var areaD = pathD + ' L' + coords[coords.length-1][0].toFixed(1) + ',' + H + ' L' + coords[0][0].toFixed(1) + ',' + H + ' Z';

  var lastUp = points[points.length-1] >= points[0];
  var lineColor = lastUp ? '#32D74B' : '#FF453A';

  var ySteps = 3;
  var gridLines = '';
  var yLabelVals = [];
  for(var i=0;i<=ySteps;i++){
    var v = min + (range*i/ySteps);
    yLabelVals.push(v);
    var y = yAt(v);
    gridLines += '<line x1="0" y1="'+y.toFixed(1)+'" x2="'+W+'" y2="'+y.toFixed(1)+'" stroke="#1A1A1C" stroke-width="1"/>';
  }
  yLabelVals.reverse();

  wrap.innerHTML =
    '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:150px;display:block;">' +
      '<defs><linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="'+lineColor+'" stop-opacity="0.35"/>' +
        '<stop offset="100%" stop-color="'+lineColor+'" stop-opacity="0"/>' +
      '</linearGradient></defs>' +
      gridLines +
      '<path d="'+areaD+'" fill="url(#chartGrad)" stroke="none"/>' +
      '<path d="'+pathD+'" fill="none" stroke="'+lineColor+'" stroke-width="2.5"/>' +
    '</svg>';

  var yLabelsEl = document.getElementById('chartYLabels');
  if(yLabelsEl){
    yLabelsEl.innerHTML = yLabelVals.map(function(v){ return '<span>'+compactFmt(v)+'</span>'; }).join('');
    yLabelsEl.style.height = '150px';
  }

  var xLabelCount = Math.min(4, dates.length);
  var xLabelsEl = document.getElementById('chartXLabels');
  if(xLabelsEl){
    var xSpans = [];
    for(var j=0;j<xLabelCount;j++){
      var idx = xLabelCount===1 ? 0 : Math.round(j*(dates.length-1)/(xLabelCount-1));
      xSpans.push('<span>'+dates[idx].slice(5).replace('-','/')+'</span>');
    }
    xLabelsEl.innerHTML = xSpans.join('');
  }
}

var currentSign = 1;
var editingId = null;
var formOpen = false;
var detailOpen = false;

function renderAddSection(){
  var editing = editingId !== null ? entries.find(function(e){ return e.id === editingId; }) : null;
  var amtVal = editing ? Math.abs(editing.pnl).toLocaleString('en-US') : '';
  var sign = editing ? (editing.pnl >= 0 ? 1 : -1) : 1;
  var dateVal = editing ? editing.date : todayStr();
  var marketVal = editing ? editing.marketState : '';
  var reasonVal = editing ? editing.reason : '';
  var invalidVal = editing ? editing.invalidation : '';
  var psychVal = editing ? (editing.psychState || '') : '';
  var sizeVal = editing ? (editing.positionSize || '') : '';
  var ruleVal = editing && editing.ruleFollowed === false ? 0 : 1;
  currentSign = sign;
  if(editing) detailOpen = !!(psychVal || sizeVal || editing.ruleFollowed === false);

  function opt(v, label){ return '<option value="'+v+'"'+(marketVal===v?' selected':'')+'>'+label+'</option>'; }
  function popt(v, label){ return '<option value="'+v+'"'+(psychVal===v?' selected':'')+'>'+label+'</option>'; }

  return '' +
  '<div class="section">' +
    '<div class="entry-toggle" id="entryToggle">' +
      '<h2 style="margin:0;">'+(editing?'기록 수정':'기록 추가')+'</h2>' +
      '<span class="plus" id="entryPlus">'+(formOpen?'–':'+')+'</span>' +
    '</div>' +
    '<div id="entryForm" class="'+(formOpen?'open':'')+'">' +
      '<div class="row2">' +
        '<div class="field"><label>날짜</label><input type="date" id="fDate" value="'+dateVal+'"></div>' +
        '<div class="field"><label>손익 구분</label>' +
          '<div class="segmented" id="signSeg">' +
            '<button type="button" data-sign="1" class="'+(sign===1?'active ':'')+'gain">수익</button>' +
            '<button type="button" data-sign="-1" class="'+(sign===-1?'active ':'')+'loss">손실</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="field"><label>금액 (원)</label><input type="text" id="fAmount" placeholder="예: 50,000" inputmode="decimal" value="'+amtVal+'"></div>' +
      '<div class="row2">' +
        '<div class="field"><label>시장 상태</label>' +
          '<select id="fMarket">' +
            '<option value=""'+(marketVal===''?' selected':'')+'>선택 안 함</option>' +
            opt('횡보','횡보') + opt('상승추세','상승추세') + opt('하락추세','하락추세') + opt('애매함','애매함') +
          '</select>' +
        '</div>' +
      '</div>' +
      '<div class="field"><label>진입 이유</label><textarea id="fReason" placeholder="예: 큰 봉 지지 자리, 5분봉 매도세 감소">'+escapeHtml(reasonVal)+'</textarea></div>' +
      '<div class="field"><label>틀렸을 때 나올 자리 (무효화 지점)</label><input type="text" id="fInvalid" placeholder="예: 저점 이탈 시 손절" value="'+escapeHtml(invalidVal)+'"></div>' +

      '<div class="detail-toggle" id="detailToggle">' +
        '<span>상세 기록 (심리·비중·원칙)</span><span class="plus" id="detailPlus">'+(detailOpen?'–':'+')+'</span>' +
      '</div>' +
      '<div id="detailBox" class="'+(detailOpen?'open':'')+'">' +
        '<div class="field"><label>심리 상태</label>' +
          '<select id="fPsych">' +
            '<option value=""'+(psychVal===''?' selected':'')+'>선택 안 함</option>' +
            popt('확신','확신') + popt('무념무상','무념무상') + popt('불안','불안') + popt('조급함','조급함') + popt('후회','후회') +
          '</select>' +
        '</div>' +
        '<div class="field"><label>매매 비중 (%)</label><input type="text" id="fSize" placeholder="예: 30" inputmode="decimal" value="'+escapeHtml(String(sizeVal))+'"></div>' +
        '<div class="field"><label>원칙 준수</label>' +
          '<div class="segmented" id="ruleSeg">' +
            '<button type="button" data-rule="1" class="'+(ruleVal===1?'active gain':'')+'">원칙매매</button>' +
            '<button type="button" data-rule="0" class="'+(ruleVal===0?'active loss':'')+'">원칙이탈</button>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<button class="btn" id="saveEntryBtn" style="margin-top:16px;">'+(editing?'수정 저장':'기록 저장')+'</button>' +
      (editing ? '<button class="btn ghost" id="cancelEditBtn" style="margin-top:8px;">취소</button>' : '') +
    '</div>' +
  '</div>';
}

var ruleFollowedSel = 1;

function bindAdd(){
  var toggle = document.getElementById('entryToggle');
  var form = document.getElementById('entryForm');
  toggle.onclick = function(){
    formOpen = !form.classList.contains('open');
    form.classList.toggle('open');
    document.getElementById('entryPlus').textContent = form.classList.contains('open') ? '–' : '+';
  };
  var segBtns = document.querySelectorAll('#signSeg button');
  segBtns.forEach(function(b){
    b.onclick = function(){
      segBtns.forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      currentSign = parseInt(b.getAttribute('data-sign'));
    };
  });
  var detailToggle = document.getElementById('detailToggle');
  var detailBox = document.getElementById('detailBox');
  detailToggle.onclick = function(){
    detailOpen = !detailBox.classList.contains('open');
    detailBox.classList.toggle('open');
    document.getElementById('detailPlus').textContent = detailBox.classList.contains('open') ? '–' : '+';
  };
  ruleFollowedSel = 1;
  var ruleBtns = document.querySelectorAll('#ruleSeg button');
  ruleBtns.forEach(function(b){
    if(b.classList.contains('active')) ruleFollowedSel = parseInt(b.getAttribute('data-rule'));
    b.onclick = function(){
      ruleBtns.forEach(function(x){ x.classList.remove('active','gain','loss'); });
      ruleFollowedSel = parseInt(b.getAttribute('data-rule'));
      b.classList.add('active', ruleFollowedSel===1 ? 'gain' : 'loss');
    };
  });
  var cancelBtn = document.getElementById('cancelEditBtn');
  if(cancelBtn){
    cancelBtn.onclick = function(){
      editingId = null;
      formOpen = false;
      detailOpen = false;
      render();
    };
  }
  attachMoneyFormat(document.getElementById('fAmount'));
  document.getElementById('saveEntryBtn').onclick = async function(){
    var amt = parseMoney(document.getElementById('fAmount').value);
    if(isNaN(amt) || amt <= 0){ alert('금액을 올바르게 입력해 주세요.'); return; }
    var sizeRaw = parseFloat(document.getElementById('fSize').value);
    var entryDate = document.getElementById('fDate').value || todayStr();
    var saveBtn = document.getElementById('saveEntryBtn');
    var originalLabel = saveBtn.textContent;
    saveBtn.textContent = '저장 중…';
    saveBtn.disabled = true;
    var fxRate = await fetchRateForDate(entryDate);
    saveBtn.textContent = originalLabel;
    saveBtn.disabled = false;
    var fields = {
      date: entryDate,
      pnl: amt * currentSign,
      marketState: document.getElementById('fMarket').value,
      reason: document.getElementById('fReason').value.trim(),
      invalidation: document.getElementById('fInvalid').value.trim(),
      psychState: document.getElementById('fPsych').value,
      positionSize: isNaN(sizeRaw) ? '' : sizeRaw,
      ruleFollowed: ruleFollowedSel === 1,
      fxRate: fxRate || null
    };
    if(editingId !== null){
      var idx = entries.findIndex(function(e){ return e.id === editingId; });
      if(idx !== -1) entries[idx] = Object.assign({ id: editingId }, fields);
      editingId = null;
    } else {
      entries.push(Object.assign({ id: Date.now() }, fields));
    }
    formOpen = false;
    detailOpen = false;
    await saveEntries();
    render();
  };
}

function renderHistorySection(){
  if(entries.length === 0){
    return '<div class="section history-section"><h2>기록</h2><p class="empty">아직 기록이 없습니다</p></div>';
  }
  var sorted = entries.slice().sort(function(a,b){ return b.date.localeCompare(a.date) || b.id - a.id; });
  var groups = {};
  var order = [];
  sorted.forEach(function(e){
    var m = e.date.slice(0,7);
    if(!groups[m]){ groups[m] = []; order.push(m); }
    groups[m].push(e);
  });

  var html = '<div class="section history-section"><h2>기록</h2>';
  order.forEach(function(m){
    var list = groups[m];
    var parts = m.split('-');
    html += '<div class="month-group">';
    html += '<div class="month-label"><span>'+parts[0]+'년 '+parseInt(parts[1])+'월</span></div>';
    list.forEach(function(e){
      var d = e.date.slice(5,7) + '/' + e.date.slice(8,10);
      var ecls = e.pnl >= 0 ? 'pos' : 'neg';
      var tags = [];
      if(e.marketState) tags.push(e.marketState);
      if(e.psychState) tags.push(e.psychState);
      if(e.ruleFollowed === false) tags.push('원칙이탈');
      if(e.positionSize !== undefined && e.positionSize !== '') tags.push('비중 '+e.positionSize+'%');
      if(e.returnRate !== undefined && e.returnRate !== '') tags.push('수익률 '+e.returnRate+'%');
      if(e.reason) tags.push(e.reason);
      if(e.invalidation) tags.push('무효화 '+e.invalidation);
      if(e.memo) tags.push(e.memo);

      html += '<div class="entry-row-compact">';
      html += '<span class="er-date num">'+d+'</span>';
      html += '<span class="er-amt num '+ecls+'">'+(e.pnl>=0?'+':'')+fmt(Math.round(e.pnl))+'</span>';
      html += '<span class="er-tags">'+escapeHtml(tags.join(' · '))+'</span>';
      html += '<span class="er-actions"><button class="entry-edit" data-id="'+e.id+'">수정</button><button class="entry-del" data-id="'+e.id+'">삭제</button></span>';
      html += '</div>';
    });
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function marketTagClass(state){
  if(state === '상승추세') return 'entry-tag-up';
  if(state === '하락추세') return 'entry-tag-down';
  if(state === '횡보') return 'entry-tag-flat';
  if(state === '애매함') return 'entry-tag-unclear';
  return '';
}

function bindHistory(){
  var editBtns = document.querySelectorAll('.entry-edit');
  editBtns.forEach(function(b){
    b.onclick = function(){
      editingId = parseInt(b.getAttribute('data-id'));
      formOpen = true;
      render();
      var formEl = document.getElementById('entryForm');
      if(formEl && formEl.scrollIntoView) formEl.scrollIntoView({ behavior:'smooth', block:'start' });
    };
  });
  var delBtns = document.querySelectorAll('.entry-del');
  delBtns.forEach(function(b){
    b.onclick = async function(){
      var id = parseInt(b.getAttribute('data-id'));
      if(!confirm('이 기록을 삭제할까요?')) return;
      entries = entries.filter(function(e){ return e.id !== id; });
      if(editingId === id){ editingId = null; formOpen = false; }
      await saveEntries();
      render();
    };
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

loadAll();
})();
